<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>All Flashcards</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f9f9f9;
      text-align: center;
      margin: 40px;
    }
    h1 {
      color: #333;
      margin-bottom: 20px;
    }
    #searchBar {
      width: 300px;
      padding: 10px;
      font-size: 16px;
      margin-bottom: 30px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    .flashcard-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: stretch; /* cards stretch vertically */
      gap: 20px;
    }
    .flashcard {
      width: 280px;
      min-height: 180px;
      perspective: 1000px;
      cursor: pointer;
      flex: 1 1 auto;
    }
    .card-inner {
      position: relative;
      width: 100%;
      min-height: 100%;
      transition: transform 0.8s;
      transform-style: preserve-3d;
    }
    .flashcard.flipped .card-inner {
      transform: rotateY(180deg);
      z-index: 10; /* bring flipped card to front */
    }
    .card-front, .card-back {
      position: absolute;
      width: 100%;
      min-height: 100%;
      backface-visibility: hidden;
      border: 1px solid #ccc;
      border-radius: 8px;
      display: flex;
      align-items: flex-start;
      justify-content: flex-start;
      padding: 15px;
      box-sizing: border-box;
      font-size: 16px;
      line-height: 1.4; /* better spacing */
      white-space: pre-wrap; /* preserve spaces and line breaks */
      word-break: break-word; /* prevent overflow */
    }
    .card-front {
      background-color: #ffffff;
      color: #333;
    }
    .card-back {
      background-color: #0066cc;
      color: #fff;
      transform: rotateY(180deg);
    }
    /* Modal for maximize view */
    .modal {
      display: none;
      position: fixed;
      z-index: 200;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background-color: rgba(0,0,0,0.7);
    }
    .modal-content {
      background-color: #fff;
      margin: 10% auto;
      padding: 20px;
      border-radius: 8px;
      width: 60%;
      max-height: 70%;
      overflow-y: auto;
      text-align: left;
      font-size: 18px;
      line-height: 1.6;
      white-space: pre-wrap;
    }
    .close {
      color: #aaa;
      float: right;
      font-size: 28px;
      font-weight: bold;
      cursor: pointer;
    }
    .close:hover {
      color: #000;
    }
  </style>
</head>
<body>
  <h1>All Flashcards</h1>
  <input type="text" id="searchBar" placeholder="Search questions or answers...">
  <div class="flashcard-container" id="flashcardContainer"></div>

  <!-- Modal for maximize view -->
  <div id="flashcardModal" class="modal">
    <div class="modal-content">
      <span class="close" id="closeModal">&times;</span>
      <div id="modalText"></div>
    </div>
  </div>

  <script>
    // Fetch Liturgicalnorms.html and extract Q&A table
    fetch('Liturgicalnorms.html')
      .then(response => response.text())
      .then(html => {
        const parser = new DOMParser();
        const doc = parser.parseFromString(html, 'text/html');
        const table = doc.querySelector('#qaTable');
        const rows = table ? table.querySelectorAll('tr') : [];

        const container = document.getElementById('flashcardContainer');

        rows.forEach(row => {
          const cells = row.querySelectorAll('td');
          if (cells.length >= 2) {
            const question = cells[0].innerText.trim();
            const answer = cells[1].innerText.trim();

            // Create flashcard
            const card = document.createElement('div');
            card.className = 'flashcard';
            card.innerHTML = `
              <div class="card-inner">
                <div class="card-front">${question}</div>
                <div class="card-back">${answer}</div>
              </div>
            `;
            // Flip on click
            card.addEventListener('click', () => card.classList.toggle('flipped'));
            // Maximize on double-click
            card.addEventListener('dblclick', () => {
              document.getElementById('modalText').innerText = 
                "Q: " + question + "\n\nA: " + answer;
              document.getElementById('flashcardModal').style.display = 'block';
            });
            container.appendChild(card);
          }
        });

        // Search functionality
        const searchBar = document.getElementById('searchBar');
        searchBar.addEventListener('input', () => {
          const query = searchBar.value.toLowerCase();
          const cards = container.querySelectorAll('.flashcard');
          cards.forEach(card => {
            const front = card.querySelector('.card-front').innerText.toLowerCase();
            const back = card.querySelector('.card-back').innerText.toLowerCase();
            if (front.includes(query) || back.includes(query)) {
              card.style.display = 'block';
            } else {
              card.style.display = 'none';
            }
          });
        });

        // Modal close
        document.getElementById('closeModal').onclick = () => {
          document.getElementById('flashcardModal').style.display = 'none';
        };
        window.onclick = (event) => {
          if (event.target === document.getElementById('flashcardModal')) {
            document.getElementById('flashcardModal').style.display = 'none';
          }
        };
      })
      .catch(err => {
        document.getElementById('flashcardContainer').innerText = 
          'Error loading flashcards. Make sure Liturgicalnorms.html is accessible.';
        console.error(err);
      });
  </script>
</body>
</html>
