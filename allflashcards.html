<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>All Flashcards</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f9f9f9;
      text-align: center;
      margin: 40px;
    }
    h1 {
      color: #333;
      margin-bottom: 30px;
    }
    .flashcard-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
    }
    .flashcard {
      width: 250px;
      height: 150px;
      perspective: 1000px;
      cursor: pointer;
    }
    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.8s;
      transform-style: preserve-3d;
    }
    .flashcard.flipped .card-inner {
      transform: rotateY(180deg);
    }
    .card-front, .card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border: 1px solid #ccc;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 15px;
      box-sizing: border-box;
      font-size: 16px;
    }
    .card-front {
      background-color: #ffffff;
      color: #333;
    }
    .card-back {
      background-color: #0066cc;
      color: #fff;
      transform: rotateY(180deg);
    }
  </style>
</head>
<body>
  <h1>All Flashcards</h1>
  <div class="flashcard-container" id="flashcardContainer"></div>

  <script>
    // Fetch Liturgicalnorms.html and extract Q&A table
    fetch('Liturgicalnorms.html')
      .then(response => response.text())
      .then(html => {
        const parser = new DOMParser();
        const doc = parser.parseFromString(html, 'text/html');
        const table = doc.querySelector('#qaTable');
        const rows = table ? table.querySelectorAll('tr') : [];

        const container = document.getElementById('flashcardContainer');

        rows.forEach(row => {
          const cells = row.querySelectorAll('td');
          if (cells.length >= 2) {
            const question = cells[0].innerText.trim();
            const answer = cells[1].innerText.trim();

            // Create flashcard
            const card = document.createElement('div');
            card.className = 'flashcard';
            card.innerHTML = `
              <div class="card-inner">
                <div class="card-front">${question}</div>
                <div class="card-back">${answer}</div>
              </div>
            `;
            card.addEventListener('click', () => card.classList.toggle('flipped'));
            container.appendChild(card);
          }
        });
      })
      .catch(err => {
        document.getElementById('flashcardContainer').innerText = 
          'Error loading flashcards. Make sure Liturgicalnorms.html is accessible.';
        console.error(err);
      });
  </script>
</body>
</html>
