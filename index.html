<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Knowledge is Power</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f9f9f9;
      margin: 50px;
      text-align: center;
    }
    h1 {
      color: #333;
      margin-bottom: 40px;
    }
    /* Main menu container */
    .main-menu {
      display: flex;
      justify-content: center;
      gap: 20px; /* reduced spacing between menus */
    }
    /* Each top-level menu */
    .menu {
      position: relative;
      background-color: #e6e6e6;
      padding: 15px 25px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      color: #004c99;
    }
    /* Submenu styling */
    .submenu {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      background-color: #ffffff;
      border: 1px solid #ccc;
      border-radius: 5px;
      min-width: 200px;
      text-align: left;
      padding: 10px;
      z-index: 100;
    }
    .submenu a {
      display: block;
      padding: 8px;
      text-decoration: none;
      color: #0066cc;
      font-size: 15px;
    }
    .submenu a:hover {
      background-color: #f0f0f0;
    }
    /* Show submenu on hover */
    .menu:hover .submenu {
      display: block;
    }
  </style>
</head>
<body>
  <h1>Knowledge is Power</h1>
  <div class="main-menu">
    <!-- Liturgical Norms Menu -->
    <div class="menu">
      Liturgical Norms
      <div class="submenu">

      </div>
    </div>

    <!-- Essential Documents Menu -->

        <!-- Add submenu links here later -->
      </div>
    </div>
  </div>
</body>
</html>
